# Railway build config for the video-processing service.
# Adds ffmpeg + yt-dlp alongside Nixpacks' normal auto-detected Node/Next.js
# build (npm ci / npm run build / npm start) — those aren't touched here.
#
# yt-dlp is pulled from nixpkgs directly rather than pip-installed: a pip
# install into the nix-managed Python (even with --break-system-packages)
# doesn't reliably land its entry-point script on PATH in the final image.
# The nixpkgs package puts the binary on PATH the same way ffmpeg already is.

[phases.setup]
nixPkgs = ["ffmpeg", "yt-dlp"]
