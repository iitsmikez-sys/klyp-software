# Railway build config for the video-processing service.
# Adds ffmpeg + yt-dlp alongside Nixpacks' normal auto-detected Node/Next.js
# build (npm ci / npm run build / npm start) — those aren't touched here.
#
# NOTE: not yet verified against a real Railway build. yt-dlp is a Python
# package, and pip's exact flags/package names can shift across nixpkgs
# versions — check the Railway build log on first deploy and adjust package
# names / the pip command here if it fails.

[phases.setup]
nixPkgs = ["ffmpeg", "python311", "python311Packages.pip"]

[phases.yt-dlp]
dependsOn = ["setup"]
cmds = ["pip install --break-system-packages yt-dlp"]
